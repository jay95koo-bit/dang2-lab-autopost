name: publish to instagram
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: repo-write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python publish.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: record posted
        run: |
          git config user.name "dang2-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "posted" && git pull --rebase && git push)
