name: render cards
on:
  push:
    paths: ["posts/**/post.json", "render.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: repo-write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - run: python render.py
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
      - name: commit images
        run: |
          git config user.name "dang2-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "render cards" && git pull --rebase && git push)
