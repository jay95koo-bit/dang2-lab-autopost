name: refresh instagram token
# Instagram 토큰은 약 60일이면 끝나므로 매주 연장해서 IG_TOKEN 비밀값을 새 토큰으로 바꾼다.
# 비밀값을 바꾸려면 GH_PAT(이 저장소의 Secrets 읽기·쓰기 권한이 있는 개인 액세스 토큰)가 필요하다.
on:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일 12:17 KST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: refresh and save
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT 비밀값이 없어서 IG_TOKEN을 자동으로 바꿀 수 없어요"
            exit 1
          fi
          resp=$(curl -sS -G "https://graph.instagram.com/refresh_access_token" \
                 --data-urlencode "grant_type=ig_refresh_token" \
                 --data-urlencode "access_token=$IG_TOKEN")
          new=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))')
          if [ -z "$new" ]; then
            echo "::error::토큰 연장 실패: ${resp//$IG_TOKEN/***}"
            exit 1
          fi
          echo "::add-mask::$new"
          days=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("expires_in",0)//86400)')
          printf '%s' "$new" | gh secret set IG_TOKEN -R "$GITHUB_REPOSITORY"
          echo "IG_TOKEN 연장 완료 (약 ${days}일 유효)"
